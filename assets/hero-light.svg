    <circle cx="20" cy="20" r="4" fill="#CBD5E1"/>
    <circle cx="34" cy="20" r="4" fill="#CBD5E1"/>
    <circle cx="48" cy="20" r="4" fill="#CBD5E1"/>
    <text x="292" y="24" text-anchor="end" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#64748B">PIPELINE · QA GATED</text>
    <line x1="16" y1="36" x2="296" y2="36" stroke="#E2E8F0" stroke-width="1"/>

    <line x1="36" y1="54" x2="36" y2="164" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="36" y1="164" x2="288" y2="164" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="36" y1="82" x2="288" y2="82" stroke="#E2E8F0" stroke-width="0.9" stroke-dasharray="3 4"/>
    <line x1="36" y1="110" x2="288" y2="110" stroke="#E2E8F0" stroke-width="0.9" stroke-dasharray="3 4"/>
    <line x1="36" y1="138" x2="288" y2="138" stroke="#E2E8F0" stroke-width="0.9" stroke-dasharray="3 4"/>
    <line x1="36" y1="164" x2="288" y2="54" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 36 164 C 72 95, 130 66, 288 56 L 288 70 C 142 82, 86 112, 36 164 Z" fill="#0284C7" fill-opacity="0.12"/>
    <path d="M 36 164 C 95 126, 175 95, 288 78" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 3"/>
    <path d="M 36 164 C 76 100, 136 73, 288 62" fill="none" stroke="url(#curve-grad-l)" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="96" cy="97" r="4" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="172" cy="74" r="4" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5"/>

    <g transform="translate(18, 184)" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600">
      <rect x="0" y="0" width="48" height="24" rx="6" fill="#E0F2FE" stroke="#7DD3FC"/>
      <text x="24" y="16" text-anchor="middle" fill="#0369A1">Plan</text>
      <path d="M 51 12 L 58 12" stroke="#94A3B8" stroke-width="1.2"/>

      <rect x="61" y="0" width="44" height="24" rx="6" fill="#D1FAE5" stroke="#6EE7B7"/>
      <text x="83" y="16" text-anchor="middle" fill="#047857">Exp</text>
      <path d="M 108 12 L 115 12" stroke="#94A3B8" stroke-width="1.2"/>

      <rect x="118" y="0" width="44" height="24" rx="6" fill="#E0E7FF" stroke="#A5B4FC"/>
      <text x="140" y="16" text-anchor="middle" fill="#3730A3">Fig</text>
      <path d="M 165 12 L 172 12" stroke="#94A3B8" stroke-width="1.2"/>

      <rect x="175" y="0" width="52" height="24" rx="6" fill="#EDE9FE" stroke="#C4B5FD"/>
      <text x="201" y="16" text-anchor="middle" fill="#5B21B6">Prose</text>
      <path d="M 230 12 L 237 12" stroke="#94A3B8" stroke-width="1.2"/>

      <rect x="240" y="0" width="38" height="24" rx="6" fill="#FEF3C7" stroke="#FCD34D"/>
      <text x="259" y="16" text-anchor="middle" fill="#B45309">Sub</text>
    </g>

    <text x="18" y="236" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#64748B">✓ 600 DPI TIFF · Structural Review · Native CSL</text>
