<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="MedAI Research Suite (research-jjd) Banner">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111C35"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="82%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Card frame -->
  <rect x="6" y="6" width="1188" height="328" rx="22" fill="url(#bg-dark)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="328" rx="22" fill="url(#grid-dark)"/>
  <rect x="6" y="6" width="1188" height="328" rx="22" fill="url(#glow-cyan)"/>
  <rect x="6" y="6" width="1188" height="328" rx="22" fill="url(#glow-emerald)"/>

  <!-- Top accent bar -->
  <rect x="56" y="6" width="140" height="3" rx="1.5" fill="url(#curve-grad)"/>

  <!-- Eyebrow pill -->
  <rect x="56" y="38" width="296" height="28" rx="14" fill="#0F2942" stroke="#0EA5E9" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="74" cy="52" r="4" fill="#10B981"/>
  <text x="86" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#7DD3FC">MEDICAL AI · REPRODUCIBLE SCIENCE</text>

  <!-- Title & subtitle -->
  <text x="56" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8" fill="url(#title-grad)">MedAI Research Suite</text>
  <text x="56" y="152" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#38BDF8">research-jjd</text>
  <text x="184" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#94A3B8">·  23 Installable Skills for Claude Code &amp; Codex</text>

  <!-- Description -->
  <text x="56" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">From study design &amp; controlled experiments to publication-grade figures,</text>
  <text x="56" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#CBD5E1">evidence-preserving manuscript polish, native Zotero + CSL Word delivery &amp; submission.</text>

  <!-- Feature chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="56" y="256" width="154" height="34" rx="8" fill="#132238" stroke="#334155" stroke-width="1"/>
    <circle cx="73" cy="273" r="3.5" fill="#38BDF8"/>
    <text x="85" y="277" fill="#E2E8F0">23 Modular Skills</text>

    <rect x="222" y="256" width="182" height="34" rx="8" fill="#132238" stroke="#334155" stroke-width="1"/>
    <circle cx="239" cy="273" r="3.5" fill="#10B981"/>
    <text x="251" y="277" fill="#E2E8F0">Evidence-Preserving</text>

    <rect x="416" y="256" width="184" height="34" rx="8" fill="#132238" stroke="#334155" stroke-width="1"/>
    <circle cx="433" cy="273" r="3.5" fill="#A78BFA"/>
    <text x="445" y="277" fill="#E2E8F0">Zotero + CSL Replay</text>

    <rect x="612" y="256" width="156" height="34" rx="8" fill="#132238" stroke="#334155" stroke-width="1"/>
    <circle cx="629" cy="273" r="3.5" fill="#F59E0B"/>
    <text x="641" y="277" fill="#E2E8F0">SHA-256 Verified</text>
  </g>

  <!-- Right scientific telemetry panel -->
  <g transform="translate(835, 42)">
    <rect x="0" y="0" width="312" height="256" rx="16" fill="#091326" fill-opacity="0.9" stroke="#1E3A5F" stroke-width="1.2"/>
    <!-- Window dots & label -->
    <circle cx="20" cy="20" r="4" fill="#334155"/>
    <circle cx="34" cy="20" r="4" fill="#334155"/>
    <circle cx="48" cy="20" r="4" fill="#334155"/>
    <text x="292" y="24" text-anchor="end" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#64748B">PIPELINE · QA GATED</text>
    <line x1="16" y1="36" x2="296" y2="36" stroke="#1E293B" stroke-width="1"/>

    <!-- Plot axes -->
    <line x1="36" y1="54" x2="36" y2="164" stroke="#334155" stroke-width="1.2"/>
    <line x1="36" y1="164" x2="288" y2="164" stroke="#334155" stroke-width="1.2"/>
    <!-- Gridlines -->
    <line x1="36" y1="82" x2="288" y2="82" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 4"/>
    <line x1="36" y1="110" x2="288" y2="110" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 4"/>
    <line x1="36" y1="138" x2="288" y2="138" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 4"/>
    <!-- Diagonal reference -->
    <line x1="36" y1="164" x2="288" y2="54" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- Confidence ribbon -->
    <path d="M 36 164 C 72 95, 130 66, 288 56 L 288 70 C 142 82, 86 112, 36 164 Z" fill="#06B6D4" fill-opacity="0.14"/>
    <!-- Baseline curve -->
    <path d="M 36 164 C 95 126, 175 95, 288 78" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 3"/>
    <!-- Primary ROC curve -->
    <path d="M 36 164 C 76 100, 136 73, 288 62" fill="none" stroke="url(#curve-grad)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Key points -->
    <circle cx="96" cy="97" r="4" fill="#10B981" stroke="#091326" stroke-width="1.5"/>
    <circle cx="172" cy="74" r="4" fill="#38BDF8" stroke="#091326" stroke-width="1.5"/>

    <!-- Stage flow pills inside telemetry card -->
    <g transform="translate(18, 184)" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600">
      <rect x="0" y="0" width="48" height="24" rx="6" fill="#0F2942" stroke="#0EA5E9" stroke-opacity="0.5"/>
      <text x="24" y="16" text-anchor="middle" fill="#7DD3FC">Plan</text>
      <path d="M 51 12 L 58 12" stroke="#475569" stroke-width="1.2"/>

      <rect x="61" y="0" width="44" height="24" rx="6" fill="#0D2E2A" stroke="#10B981" stroke-opacity="0.5"/>
      <text x="83" y="16" text-anchor="middle" fill="#6EE7B7">Exp</text>
      <path d="M 108 12 L 115 12" stroke="#475569" stroke-width="1.2"/>

      <rect x="118" y="0" width="44" height="24" rx="6" fill="#1E2044" stroke="#818CF8" stroke-opacity="0.5"/>
      <text x="140" y="16" text-anchor="middle" fill="#A5B4FC">Fig</text>
      <path d="M 165 12 L 172 12" stroke="#475569" stroke-width="1.2"/>

      <rect x="175" y="0" width="52" height="24" rx="6" fill="#2A1D42" stroke="#A78BFA" stroke-opacity="0.5"/>
      <text x="201" y="16" text-anchor="middle" fill="#C4B5FD">Prose</text>
      <path d="M 230 12 L 237 12" stroke="#475569" stroke-width="1.2"/>

      <rect x="240" y="0" width="38" height="24" rx="6" fill="#2E2312" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="259" y="16" text-anchor="middle" fill="#FCD34D">Sub</text>
    </g>

    <text x="18" y="236" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#64748B">✓ 600 DPI TIFF · Structural Review · Native CSL</text>
  </g>
</svg>
