name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # Installs every skill listed in install.py (medfig-*, scipilot-medimg-figure-skill, medical-sci-*,
      # medpaper-pipeline) into ~/.claude/skills and ~/.codex/skills, exactly as a user would.
      - name: Install skills
        run: python install.py
      # The layout tests measure text with Arial. ttf-mscorefonts-installer downloads from SourceForge and exits 0
      # even when a mirror times out (then no font is installed), so retry the download and fail if Arial is absent.
      - name: Install fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ttf-mscorefonts-installer fonts-dejavu-core
          for i in 1 2 3; do
            fc-list | grep -qi "/arial.ttf" && break
            echo "Arial missing after attempt $i; retrying the core-font download"
            sleep 20
            sudo dpkg-reconfigure -f noninteractive ttf-mscorefonts-installer || true
          done
          fc-list | grep -i "/arial.ttf" || { echo "::error::Arial not installed (SourceForge download failed)"; exit 1; }
          rm -rf ~/.cache/matplotlib
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Replica portable checks
        working-directory: sci-figure-replica
        run: >-
          python -m pytest -q
          tests/test_gallery.py tests/test_index.py tests/test_crop.py
          tests/test_estimate.py tests/test_parse_post.py tests/test_qa.py
          tests/test_install.py tests/test_bootstrap.py
